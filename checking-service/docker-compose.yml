services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checking_db
      POSTGRES_USER: checking_user
      POSTGRES_PASSWORD: ${CHECKING_DB_PASSWORD:-checking_dev_password}
    volumes:
      - checking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checking_user -d checking_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: CheckingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=checking_db;Username=checking_user;Password=${CHECKING_DB_PASSWORD:-checking_dev_password}"
    volumes:
      - checking_photos:/app/photos
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8091:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  checking_postgres_data:
  checking_photos:
