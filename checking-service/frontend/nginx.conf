server {
    listen 80;
    client_max_body_size 9m;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://checking-backend:8080;
        proxy_set_header Host $host;
    }
    location /swagger {
        proxy_pass http://checking-backend:8080;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
