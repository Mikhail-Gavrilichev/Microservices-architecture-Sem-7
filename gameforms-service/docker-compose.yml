services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gameforms
      POSTGRES_USER: gameforms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameforms_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameforms -d gameforms"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: GameFormsService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=gameforms;Username=gameforms;Password=${POSTGRES_PASSWORD:-gameforms_dev_password}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
